<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>2048 Neon</title>
  <style>
    :root { --bg:#0b0d17; --panel:#141830; --cell:#1b2040; --text:#e8ebff; --accent:#22d3ee; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; touch-action:none; }
    .wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:12px; }
    header { width:min(92vw, 440px); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    h1 { margin:0; font-size:clamp(26px,7vw,40px); letter-spacing:1px; color:var(--accent); text-shadow:0 0 14px rgba(34,211,238,.6); }
    .scores { display:flex; gap:8px; }
    .score { background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:6px 12px; text-align:center; min-width:70px; }
    .score small { display:block; font-size:10px; letter-spacing:1px; color:#8c93ae; }
    .score b { font-size:18px; }
    .bar { width:min(92vw, 440px); display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .bar p { margin:0; font-size:12px; color:#8c93ae; }
    button { font:inherit; font-weight:700; color:#06121a; background:var(--accent); border:0; border-radius:10px; padding:9px 14px; cursor:pointer; }
    button.ghost { background:var(--panel); color:var(--text); border:1px solid rgba(255,255,255,.12); }
    button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
    #board { position:relative; width:min(92vw, 440px); aspect-ratio:1; background:var(--panel); border-radius:16px; padding:10px;
      display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:10px;
      box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 18px 50px rgba(0,0,0,.5); }
    .cell { background:var(--cell); border-radius:10px; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:clamp(18px,6.2vw,34px); transition:transform .08s; user-select:none; }
    .pop { animation:pop .16s ease; }
    @keyframes pop { 0%{transform:scale(.6)} 100%{transform:scale(1)} }
    .t2{background:#243056;color:#bcd0ff} .t4{background:#2c3a6e;color:#d6e2ff}
    .t8{background:#0e7490;color:#fff} .t16{background:#0891b2;color:#fff}
    .t32{background:#7c3aed;color:#fff} .t64{background:#9333ea;color:#fff}
    .t128{background:#db2777;color:#fff;font-size:clamp(16px,5.4vw,30px)} .t256{background:#e11d48;color:#fff;font-size:clamp(16px,5.4vw,30px)}
    .t512{background:#ea580c;color:#fff;font-size:clamp(16px,5.4vw,30px)} .t1024{background:#f59e0b;color:#111;font-size:clamp(14px,4.6vw,26px)}
    .t2048{background:#facc15;color:#111;font-size:clamp(14px,4.6vw,26px);box-shadow:0 0 22px #facc15} .tbig{background:#fff;color:#111;font-size:clamp(12px,4vw,22px)}
    #overlay { position:absolute; inset:0; border-radius:16px; background:rgba(11,13,23,.82); display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:12px; text-align:center; }
    #overlay.show { display:flex; }
    #overlay h2 { margin:0; font-size:28px; color:var(--accent); }
    #overlay p { margin:0; color:#aab1d0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score"><small>SCORE</small><b id="score">0</b></div>
        <div class="score"><small>BEST</small><b id="best">0</b></div>
      </div>
    </header>
    <div class="bar">
      <p>Swipe or use arrow keys to merge tiles.</p>
      <div style="display:flex;gap:6px">
        <button class="ghost" id="undo" type="button" aria-label="Undo last move">Undo</button>
        <button id="new" type="button">New</button>
      </div>
    </div>
    <div id="board" aria-live="polite">
      <div id="overlay" role="dialog" aria-modal="true">
        <h2 id="ovTitle">Game over</h2>
        <p id="ovSub"></p>
        <div style="display:flex;gap:8px">
          <button id="ovKeep" class="ghost" type="button" style="display:none">Keep going</button>
          <button id="ovNew" type="button">Play again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SIZE = 4, BEST_KEY = "neon2048_best", STATE_KEY = "neon2048_state";
      var boardEl = document.getElementById("board"), overlay = document.getElementById("overlay");
      var grid, score, best = 0, won = false, keepGoing = false, prev = null, cells = [];

      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      for (var i = 0; i < SIZE * SIZE; i++) {
        var c = document.createElement("div"); c.className = "cell";
        boardEl.insertBefore(c, overlay); cells.push(c);
      }

      function empty() { return Array.from({ length: SIZE }, function () { return Array(SIZE).fill(0); }); }
      function clone(g) { return g.map(function (r) { return r.slice(); }); }

      function addTile() {
        var free = [];
        for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (!grid[r][c]) free.push([r, c]);
        if (!free.length) return null;
        var p = free[Math.floor(Math.random() * free.length)];
        grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
        return p;
      }

      function render(newPos) {
        for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
          var v = grid[r][c], el = cells[r * SIZE + c];
          el.className = "cell" + (v ? " t" + (v > 2048 ? "big" : v) : "");
          el.textContent = v || "";
          if (newPos && newPos[0] === r && newPos[1] === c) el.classList.add("pop");
        }
        document.getElementById("score").textContent = score;
        document.getElementById("best").textContent = best;
      }

      function save() { lsSet(STATE_KEY, JSON.stringify({ grid: grid, score: score, won: won, keepGoing: keepGoing })); }

      function slide(line) {
        var arr = line.filter(Boolean), gained = 0;
        for (var i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) { arr[i] *= 2; gained += arr[i]; arr.splice(i + 1, 1); }
        }
        while (arr.length < SIZE) arr.push(0);
        return { line: arr, gained: gained };
      }

      function move(dir) { // 0 left, 1 up, 2 right, 3 down
        if (overlay.classList.contains("show")) return;
        var before = JSON.stringify(grid), snap = { grid: clone(grid), score: score }, gained = 0, r, c, res;
        for (var k = 0; k < SIZE; k++) {
          var line = [];
          for (var j = 0; j < SIZE; j++) {
            r = dir % 2 === 0 ? k : (dir === 1 ? j : SIZE - 1 - j);
            c = dir % 2 === 1 ? k : (dir === 0 ? j : SIZE - 1 - j);
            line.push(grid[r][c]);
          }
          res = slide(line); gained += res.gained;
          for (j = 0; j < SIZE; j++) {
            r = dir % 2 === 0 ? k : (dir === 1 ? j : SIZE - 1 - j);
            c = dir % 2 === 1 ? k : (dir === 0 ? j : SIZE - 1 - j);
            grid[r][c] = res.line[j];
          }
        }
        if (JSON.stringify(grid) === before) return;
        prev = snap; score += gained;
        if (score > best) { best = score; lsSet(BEST_KEY, String(best)); }
        var pos = addTile();
        render(pos); save(); checkEnd();
      }

      function canMove() {
        for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
          if (!grid[r][c]) return true;
          if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
          if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
        }
        return false;
      }

      function show(title, sub, keep) {
        document.getElementById("ovTitle").textContent = title;
        document.getElementById("ovSub").textContent = sub;
        document.getElementById("ovKeep").style.display = keep ? "inline-block" : "none";
        overlay.classList.add("show");
      }

      function checkEnd() {
        if (!won && !keepGoing && grid.some(function (row) { return row.indexOf(2048) >= 0; })) {
          won = true; show("You made 2048!", "Score " + score, true); return;
        }
        if (!canMove()) { show("Game over", "Final score " + score, false); lsSet(STATE_KEY, ""); }
      }

      function newGame() {
        grid = empty(); score = 0; won = false; keepGoing = false; prev = null;
        addTile(); addTile();
        overlay.classList.remove("show");
        render(); save();
      }

      function load() {
        best = parseInt(lsGet(BEST_KEY) || "0", 10) || 0;
        try {
          var s = JSON.parse(lsGet(STATE_KEY) || "null");
          if (s && Array.isArray(s.grid) && s.grid.length === SIZE && s.grid.every(function (r) { return Array.isArray(r) && r.length === SIZE; })) {
            grid = s.grid; score = +s.score || 0; won = !!s.won; keepGoing = !!s.keepGoing;
            render(); if (!canMove()) newGame(); return;
          }
        } catch (e) {}
        newGame();
      }

      document.getElementById("new").onclick = newGame;
      document.getElementById("ovNew").onclick = newGame;
      document.getElementById("ovKeep").onclick = function () { keepGoing = true; overlay.classList.remove("show"); };
      document.getElementById("undo").onclick = function () {
        if (!prev) return;
        grid = prev.grid; score = prev.score; prev = null;
        overlay.classList.remove("show"); render(); save();
      };

      window.addEventListener("keydown", function (e) {
        var map = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3, a: 0, w: 1, d: 2, s: 3 };
        if (e.key in map) { e.preventDefault(); move(map[e.key]); }
      });

      var sx = 0, sy = 0;
      boardEl.addEventListener("touchstart", function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
      boardEl.addEventListener("touchend", function (e) {
        var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0); else move(dy > 0 ? 3 : 1);
      }, { passive: true });

      load();
    })();
  </script>
</body>
</html>
